# Yahoo CSV → JSON → GCS (並列パス)
# Primary: UTC 22:00 = JST 07:00（g16≈UTC 21:00 の約1時間後）
# 注意: JST 03:00 / 04:00 は不可 — g01–g16 は JST 01:00–06:00 まで稼働するため途中になる
name: Upload Yahoo JSON to GCS

on:
  schedule:
    # UTC 22:00 = JST 07:00 — after Schedule-g16 (UTC 21:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Scrape date folder (YYYY-MM-DD or YYYY-MMDD). Empty = JST yesterday'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no GCS writes)'
        required: false
        type: boolean
        default: false
      skip_existing:
        description: 'Skip objects that already exist'
        required: false
        type: boolean
        default: false
  # Secondary: after Schedule g16 succeeds (~UTC 21:00). Primary cron still at 22:00.
  workflow_run:
    workflows:
      - Schedule g16
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    # workflow_run: only when Schedule g16 succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements-gcs.txt

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Convert CSV and upload JSON to GCS
        env:
          INPUT_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || '' }}
          INPUT_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          INPUT_SKIP: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_existing || false }}
        run: |
          set -euo pipefail
          ARGS=(--repo-root .)
          if [ -n "${INPUT_DATE}" ]; then
            ARGS+=(--date "${INPUT_DATE}")
          fi
          if [ "${INPUT_DRY}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${INPUT_SKIP}" = "true" ]; then
            ARGS+=(--skip-existing)
          fi
          echo "Running: python py/csv_to_gcs_yahoo_json.py ${ARGS[*]}"
          python py/csv_to_gcs_yahoo_json.py "${ARGS[@]}"

      - name: Notify Discord on scheduled success
        if: ${{ success() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE="✅ Upload Yahoo JSON to GCS #${GITHUB_RUN_NUMBER} (Scheduled) completed successfully.\n${RUN_URL}"
          jq -n --arg content "${MESSAGE}" '{content: $content}' \
            | curl --fail-with-body --retry 3 \
                -H "Content-Type: application/json" \
                --data-binary @- \
                "${DISCORD_WEBHOOK_URL}"
